<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lift Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one phone-width column, sticky brand bar on top, fixed tab bar on the bottom, the workout as a stack of set-entry cards. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --surface-2: #e3e8ef;
  --ink: #121924;
  --ink-2: #485468;
  --ink-3: #6f7b8e;
  --line: #d2d9e3;
  --accent: #1d4ed0;
  --accent-ink: #ffffff;
  --accent-soft: #dce6fc;
  --good: #14733a;
  --good-soft: #d9f2e2;
  --warn: #8f5a06;
  --warn-soft: #fbeccb;
  --bad: #b3201f;
  --bad-soft: #fbdcdb;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #171d27; --surface-2: #222a37; --ink: #e8edf4; --ink-2: #a8b3c4; --ink-3: #7c889c;
    --line: #2b3444; --accent: #82a6ff; --accent-ink: #0a1020; --accent-soft: #1b2a4f;
    --good: #5bd98a; --good-soft: #12331f; --warn: #f2bd4b; --warn-soft: #3a2c0b; --bad: #ff8782; --bad-soft: #401716;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #171d27; --surface-2: #222a37; --ink: #e8edf4; --ink-2: #a8b3c4; --ink-3: #7c889c;
  --line: #2b3444; --accent: #82a6ff; --accent-ink: #0a1020; --accent-soft: #1b2a4f;
  --good: #5bd98a; --good-soft: #12331f; --warn: #f2bd4b; --warn-soft: #3a2c0b; --bad: #ff8782; --bad-soft: #401716;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in, .wrap, .nav-in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.02em; text-transform: none; color: var(--ink-3); margin-top: 3px; }
.sync { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.sync.ok { background: var(--good-soft); color: var(--good); }
.sync.warn { background: var(--warn-soft); color: var(--warn); }

.wrap { padding-block: 16px 150px; }
.view { display: flex; flex-direction: column; gap: 14px; }
.h-sec { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1.1; margin-top: 10px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 0.92rem; }
.muted { color: var(--ink-3); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }

.nav { position: fixed; inset: auto 0 0 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { display: grid; grid-template-columns: repeat(4, 1fr); }
.nav a { display: block; text-align: center; padding: 14px 4px 12px; text-decoration: none; color: var(--ink-3); font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: 0.06em; text-transform: uppercase; border-top: 3px solid transparent; margin-top: -1px; }
.nav a[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 10px; }
.hero-title { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hero-row input[type="date"] { height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 16px; }
.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; }
.pick[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pick .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }

.note-box { border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 8px; }
.note-box.info { background: var(--accent-soft); }
.note-box.warn { background: var(--warn-soft); }
.note-box.good { background: var(--good-soft); }
.note-box strong { font-weight: 600; }
.note-box ul { margin: 0; padding-left: 18px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 0.92rem; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { width: 100%; min-height: 54px; font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.05em; text-transform: uppercase; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.link { border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ex-name { font-weight: 600; font-size: 1.08rem; line-height: 1.2; }
.ex-scheme { color: var(--ink-2); font-size: 0.88rem; margin-top: 2px; }
.chip { flex: none; font-size: 0.76rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.chip.up { background: var(--good-soft); color: var(--good); }
.chip.down, .chip.reset, .chip.deload { background: var(--warn-soft); color: var(--warn); }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.ex-note { font-size: 0.88rem; color: var(--ink-2); }
.ex-meta { font-size: 0.82rem; color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-labels, .set { display: grid; grid-template-columns: 2.5rem minmax(0, 1.25fr) 0.7rem minmax(0, 1fr) 4.1rem 2.75rem; gap: 6px; align-items: center; }
.set-labels { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.set .tag { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.set .tag.top { color: var(--accent); }
.set .x { text-align: center; color: var(--ink-3); }
.set input, .set select { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; padding: 0 2px; }
.set select { font-size: 16px; text-align-last: center; }
.set input::placeholder { color: var(--ink-3); opacity: 0.75; font-weight: 400; }
.set .done { height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-3); font-size: 1.15rem; font-weight: 700; }
.set.is-done .done { background: var(--good); border-color: var(--good); color: var(--surface); }
.set.is-done input, .set.is-done select { background: var(--good-soft); border-color: transparent; }
.ex-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); font-weight: 600; }
details.how p { font-size: 0.88rem; color: var(--ink-2); margin-top: 6px; }

.finish { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.finish label { font-size: 0.85rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.finish textarea, .finish input, .field { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 16px; }
.finish textarea { min-height: 64px; resize: vertical; }

.timer { position: fixed; left: 0; right: 0; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); z-index: 8; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 8px; pointer-events: none; }
.timer-in { max-width: 608px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.timer-clock { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; min-width: 3.4rem; }
.timer-label { flex: 1; min-width: 0; font-size: 0.82rem; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; font-weight: 600; opacity: 0.9; }
.timer.go .timer-in { background: var(--good); color: var(--surface); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(120px + env(safe-area-inset-bottom, 0px)); z-index: 11; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; max-width: calc(100% - 32px); text-align: center; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tile-k { font-size: 0.78rem; color: var(--ink-2); }
.tile-v { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile-v small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.tile-d { font-size: 0.8rem; color: var(--ink-3); }
.tile-d.up { color: var(--good); font-weight: 600; }

.chart-card select { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; font-size: 16px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis-t { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.1; stroke: none; }
.chart .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .end-t { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font-body); }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 5px 9px; font-size: 0.78rem; white-space: nowrap; transform: translateX(-50%); }
.tip b { font-weight: 600; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
table.data th { color: var(--ink-3); font-weight: 500; }
.scroll-x { overflow-x: auto; }

.vol { display: flex; flex-direction: column; gap: 9px; }
.vol-row { display: grid; grid-template-columns: 5.4rem minmax(0, 1fr) 4.6rem; gap: 10px; align-items: center; font-size: 0.88rem; }
.vol-track { position: relative; height: 18px; }
.vol-zone { position: absolute; top: 0; bottom: 0; background: var(--surface-2); border-radius: 4px; }
.vol-bar { position: absolute; left: 0; top: 5px; height: 8px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 0; }
.vol-tick { position: absolute; top: 1px; bottom: 1px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.vol-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.vol-val b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--ink-3); }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.lg-bar { width: 16px; height: 6px; background: var(--accent); border-radius: 0 3px 3px 0; }
.lg-zone { width: 16px; height: 12px; background: var(--surface-2); border-radius: 3px; }
.lg-tick { width: 2px; height: 12px; background: var(--ink-2); }

.bw-form { display: flex; gap: 8px; }
.bw-form input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; font-size: 16px; }

.hist { display: flex; flex-direction: column; gap: 8px; }
.hist details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.hist summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 0.95rem; }
.hist summary span:last-child { color: var(--ink-3); font-weight: 400; font-size: 0.85rem; white-space: nowrap; }
.hist dl { margin: 10px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; font-size: 0.88rem; }
.hist dt { color: var(--ink-2); }
.hist dd { margin: 0; font-variant-numeric: tabular-nums; }
.hist .h-actions { margin-top: 10px; display: flex; justify-content: flex-end; }

.prog-sess { display: flex; flex-direction: column; gap: 4px; }
.prog-sess h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.03em; text-transform: uppercase; }
.prog-sess .tagline { color: var(--ink-3); font-size: 0.85rem; margin-bottom: 4px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.prog-row .r-load { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.prog-row .r-sub { grid-column: 1 / -1; color: var(--ink-3); font-size: 0.82rem; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.prose h3 { font-size: 1rem; font-weight: 600; }
.prose p, .prose li { color: var(--ink-2); font-size: 0.95rem; }
.prose ol, .prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.prose .refs li { font-size: 0.85rem; }
.rule { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 4px 12px; font-size: 0.92rem; }
.rule dt { font-weight: 600; }
.rule dd { margin: 0; color: var(--ink-2); }
textarea.io { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-reduced-motion: no-preference) { .set .done, .btn { transition: background-color 0.12s ease; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">Lift Ledger<small>Powerbuilding, upper-body bias</small></div>
    <span class="sync" id="sync" role="status">Starting</span>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-program" hidden></section>
  <section class="view" id="v-data" hidden></section>
</main>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <span class="timer-clock" id="timer-clock">0:00</span>
    <span class="timer-label" id="timer-label"></span>
    <button type="button" id="timer-add">+30s</button>
    <button type="button" id="timer-skip">Skip</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <a href="#today" data-tab="today">Today</a>
    <a href="#progress" data-tab="progress">Progress</a>
    <a href="#program" data-tab="program">Program</a>
    <a href="#data" data-tab="data">Data</a>
  </div>
</nav>

<script>
(function () {
'use strict';

/* ───────────── Program definition ─────────────
   type 'top' = one heavy top set, then back-off sets at a fixed share of it.
   type 'dp'  = straight sets, double progression (add reps, then load).
   m = muscles trained; 1 is a direct set, 0.5 an indirect one (fractional counting). */
var EX = {
  bench:    { n: 'Barbell Bench Press', eq: 'barbell', type: 'top', range: [3, 5], bo: { pct: 0.875, range: [6, 8] }, inc: 5, rest: 180, rir: '1–2', m: { chest: 1, triceps: 0.5, shoulders: 0.5 },
              cue: 'One heavy top set for strength, stopped 1–2 reps short of failure. Back-off sets run at about 87.5% of the top set and carry most of the chest volume. Rest a full 3 minutes.' },
  squat:    { n: 'High-Bar Back Squat', eq: 'barbell', type: 'top', range: [3, 5], bo: { pct: 0.85, range: [5, 7] }, inc: 5, rest: 180, rir: '2', m: { quads: 1, glutes: 0.5 },
              cue: 'Coming back from the hip injury: keep the depth and tempo pain-free and leave 2 reps in reserve. If the hip complains, repeat the load next time instead of adding. Load only goes up once you log 5 clean reps.' },
  incbb:    { n: 'Incline Barbell Press', eq: 'barbell', type: 'dp', range: [6, 10], inc: 5, rest: 150, rir: '1–2', m: { chest: 1, triceps: 0.5, shoulders: 0.5 },
              cue: 'Lower under control to the upper chest. When all 3 sets reach 10 reps, the load goes up.' },
  incdb:    { n: 'Incline Dumbbell Press', eq: 'db', type: 'dp', range: [8, 12], inc: 5, rest: 150, rir: '1–2', m: { chest: 1, triceps: 0.5, shoulders: 0.5 },
              cue: 'Bench on setting 4. Let the dumbbells travel deep for a full stretch at the bottom.' },
  pecdeck:  { n: 'Pec Deck', eq: 'machine', type: 'dp', range: [10, 15], inc: 5, rest: 90, rir: '0–1', m: { chest: 1 },
              cue: 'Set the seat so the stretch is deep but comfortable. Safe to take the last set to failure.' },
  pulldown: { n: 'Lat Pulldown', eq: 'machine', type: 'dp', range: [8, 12], inc: 5, rest: 120, rir: '1–2', m: { back: 1, biceps: 0.5 },
              cue: 'Full hang at the top, pull the elbows down to your sides, no swinging.' },
  dbrow:    { n: 'Single-Arm Dumbbell Row', eq: 'db', type: 'dp', range: [8, 12], inc: 5, rest: 120, rir: '1–2', m: { back: 1, biceps: 0.5 },
              cue: 'Let the shoulder blade stretch forward at the bottom, then row to the hip. Log the reps per arm.' },
  cablerow: { n: 'Seated Cable Row', eq: 'cable', type: 'dp', range: [8, 12], inc: 5, rest: 120, rir: '1–2', start: 150, m: { back: 1, biceps: 0.5 },
              cue: 'Reach forward for a full stretch, pull to the lower ribs, keep the torso still.' },
  dbpress:  { n: 'Seated Dumbbell Shoulder Press', eq: 'db', type: 'dp', range: [8, 12], inc: 5, rest: 120, rir: '1–2', start: 55, m: { shoulders: 1, triceps: 0.5 },
              cue: 'Bench one notch back from upright. Lower to about ear height.' },
  latraise: { n: 'Lateral Raise', eq: 'db', type: 'dp', range: [12, 20], inc: 5, rest: 75, rir: '0–1', start: 20, m: { shoulders: 1 },
              cue: 'Cable or dumbbell. The rep range is wide on purpose, because the jump to the next weight is large. Take sets close to failure.' },
  reardelt: { n: 'Reverse Pec Deck', eq: 'machine', type: 'dp', range: [12, 20], inc: 5, rest: 60, rir: '0–1', start: 80, m: { shoulders: 1, back: 0.5 },
              cue: 'Lead with the elbows and keep the traps quiet.' },
  ohtri:    { n: 'Overhead Cable Triceps Extension', eq: 'cable', type: 'dp', range: [10, 15], inc: 5, rest: 90, rir: '0–1', start: 50, m: { triceps: 1 },

  var html = '<h2 class="h-sec">The rotation</h2><p class="sub">Five sessions, run in order, 4 or 5 days a week. Take a rest day whenever you need one and pick up where you left off. A good week looks like Upper A, Lower A, rest, Upper B, Arms &amp; Delts, Lower B, rest.</p>';
  html += ROT.map(function (r) {
    return '<div class="card prog-sess"><h3>' + esc(r.name) + (r.id === nextId ? ' <span class="chip new">Next</span>' : '') + '</h3><p class="tagline">' + esc(r.tag) + '</p>' + r.items.map(function (it) {
      var p = plan(it[0], it[1], deload), ex = EX[it[0]];
      var load = ex.type === 'top' && !deload ? fmtW(p.rows[0].w) + ' / ' + fmtW(p.rows[1].w) + ' lb' : fmtW(p.rows[0].w) + ' lb';
      return '<div class="prog-row"><span>' + esc(ex.n) + '</span><span class="r-load">' + load + '</span><span class="r-sub">' + schemeText(it[0], it[1], deload) + (p.est ? ' · starting estimate' : '') + '</span></div>';
    }).join('') + '</div>';
  }).join('');

  html += '<h2 class="h-sec">Sets per rotation</h2><div class="card scroll-x"><table class="data"><thead><tr><th>Muscle</th><th>Sets</th><th>Weekly target</th></tr></thead><tbody>' +
    MUSCLES.map(function (m) { return '<tr><td>' + m[1] + '</td><td>' + (Math.round((vp[m[0]] || 0) * 10) / 10) + '</td><td>' + m[2] + '–' + m[3] + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="small muted">Direct sets count 1, indirect sets 0.5. At 5 sessions a week one rotation is one week. At 4 a week you get about 80% of these numbers, which still keeps every upper-body muscle near or above 10.</p>';

  html += '<h2 class="h-sec">How the loads move</h2><div class="card"><dl class="rule">' +
    '<dt>Add reps</dt><dd>Keep the load and beat last time by a rep, staying inside the rep range.</dd>' +
    '<dt>Add load</dt><dd>When every set reaches the top of the range, the load goes up 5 lb (10 lb on RDL and calves) and reps restart at the low end.</dd>' +
    '<dt>Top sets</dt><dd>Bench and squat use one heavy set of 3–5. Log 5 and it goes up 5 lb. Log 5 with 3 or more in reserve and it goes up 10. Back-off sets follow the top set automatically.</dd>' +
    '<dt>Missed</dt><dd>Fall under the range on the first set and the load is recalculated down from what you did.</dd>' +
    '<dt>Stalled</dt><dd>Three sessions at one load with no added reps triggers a 7.5–10% reset so you can build back past the sticking point.</dd>' +
    '<dt>Your call</dt><dd>The weight boxes are editable. Whatever you log becomes the basis for next time.</dd></dl></div>';

  html += '<h2 class="h-sec">Deload</h2><div class="card"><p class="sub">' + (deload ? 'Deload is on: ' + S.meta.deloadLeft + ' easy ' + (S.meta.deloadLeft === 1 ? 'session' : 'sessions') + ' left.' : 'Sessions since the last deload: ' + sinceDeload() + '. The app suggests an easy rotation after about ' + DELOAD_AFTER + '. Take it when you feel run down, skip it when you feel good.') + '</p>' +
    '<div class="row-btns"><button type="button" class="btn" data-act="' + (deload ? 'deload-end' : 'deload-start') + '">' + (deload ? 'End deload' : 'Start a deload rotation') + '</button></div></div>';

  html += '<h2 class="h-sec">Why it is built this way</h2><div class="prose">' +
    '<h3>Volume: 13–20 weekly sets for the upper body</h3><p>Muscle growth rises with weekly sets per muscle, with diminishing returns. Ten or more sets a week beat fewer in the Schoenfeld 2017 meta-analysis [1], 12–20 is the range Baz-Valle 2022 suggests for trained lifters [2], and the Pelland 2025 meta-regression shows growth still climbing with volume, more slowly each step [3]. Chest and back sit at 13–15, shoulders and arms at 18–20, where you asked for the bias.</p>' +
    '<h3>Legs get enough to stay strong and no more</h3><p>Around 8 hard sets a week for quads and hamstrings. Size and strength are far cheaper to keep than to build: Bickel 2011 held muscle size on roughly a third of the original volume [4]. That frees recovery for the upper body, and it suits a hip that is still coming back.</p>' +
    '<h3>Each muscle 2–3 times per rotation</h3><p>Frequency itself matters little once weekly volume is matched [5]. Spreading 18 arm sets across three sessions keeps each set higher quality than cramming them into one.</p>' +
    '<h3>Heavy top sets for strength, moderate reps for size</h3><p>Growth is similar across a wide span of loads when sets are hard, but maximal strength responds best to heavy loading [6]. So bench and squat open with a top set of 3–5, and everything else lives between 6 and 20 reps.</p>' +
    '<h3>Close to failure, not always to failure</h3><p>Growth improves as sets end nearer to failure, while strength gains do not depend on it [7][8]. Big barbell lifts stop 1–2 reps short, where fatigue is costly. Machines, cables and curls go to 0–1.</p>' +
    '<h3>Rest long enough</h3><p>Resting more than a minute gives a small growth advantage, with little extra beyond about 90 seconds for size [9], and 3 minutes beat 1 minute for strength and size in trained men [10]. The timer uses 3 minutes on top-set lifts, 2–2.5 on other compounds and 60–90 seconds on isolation work.</p>' +
    '<h3>Train muscles at long lengths</h3><p>Overhead triceps extensions grew the triceps substantially more than pushdowns over 12 weeks [11], and seated leg curls beat lying ones for the hamstrings [12]. The same reasoning picks incline and behind-the-body curls, deep incline pressing and RDLs. The direct evidence is strongest for triceps and hamstrings.</p>' +
    '<h3>Progress by reps, then load</h3><p>Adding reps at a fixed load and adding load at fixed reps produced similar growth over 8 weeks [13]. Double progression uses both, and it works with 5 lb jumps on small lifts.</p>' +
    '<h3>Deloads are optional</h3><p>A scheduled week off in the middle of a 9-week programme did not improve growth and slightly reduced strength gains in Coleman 2024 [14]. So the app offers a deload about every five rotations and leaves the choice to how you feel.</p>' +
    '<h3>Outside the gym</h3><p>Protein at about 1.6 g per kg of bodyweight per day captures most of the benefit for muscle gain [15]. A small calorie surplus and 7 or more hours of sleep do the rest.</p>' +
    '<h3>References</h3><ol class="refs">' +
    '<li>Schoenfeld BJ, Ogborn D, Krieger JW. Dose-response relationship between weekly resistance training volume and increases in muscle mass. J Sports Sci. 2017.</li>' +
    '<li>Baz-Valle E, et al. A systematic review of the effects of different resistance training volumes on muscle hypertrophy. J Hum Kinet. 2022.</li>' +
    '<li>Pelland JC, et al. The resistance training dose-response: meta-regressions exploring the effects of weekly volume and frequency on muscle hypertrophy and strength gain. Sports Med. 2025.</li>' +
    '<li>Bickel CS, Cross JM, Bamman MM. Exercise dosing to retain resistance training adaptations in young and older adults. Med Sci Sports Exerc. 2011.</li>' +
    '<li>Schoenfeld BJ, Grgic J, Krieger J. How many times per week should a muscle be trained to maximize muscle hypertrophy? J Sports Sci. 2019.</li>' +
    '<li>Schoenfeld BJ, Grgic J, Ogborn D, Krieger JW. Strength and hypertrophy adaptations between low- vs. high-load resistance training. J Strength Cond Res. 2017.</li>' +
    '<li>Robinson ZP, et al. Exploring the dose-response relationship between estimated resistance training proximity to failure, strength gain, and muscle hypertrophy. Sports Med. 2024.</li>' +
    '<li>Refalo MC, et al. Influence of resistance training proximity-to-failure on skeletal muscle hypertrophy. Sports Med. 2023.</li>' +
    '<li>Singer A, et al. Give it a rest: a systematic review with Bayesian meta-analysis on the effect of inter-set rest interval duration on muscle hypertrophy. Front Sports Act Living. 2024.</li>' +
    '<li>Schoenfeld BJ, et al. Longer interset rest periods enhance muscle strength and hypertrophy in resistance-trained men. J Strength Cond Res. 2016.</li>' +
    '<li>Maeo S, et al. Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead versus neutral arm position. Eur J Sport Sci. 2023.</li>' +
    '<li>Maeo S, et al. Greater hamstrings muscle hypertrophy but similar damage protection after training at long versus short muscle lengths. Med Sci Sports Exerc. 2021.</li>' +
    '<li>Plotkin D, et al. Progressive overload without progressing load? The effects of load or repetition progression on muscular adaptations. PeerJ. 2022.</li>' +
    '<li>Coleman M, et al. Gaining more from doing less? The effects of a one-week deload period during supervised resistance training on muscular adaptations. PeerJ. 2024.</li>' +
    '<li>Morton RW, et al. A systematic review, meta-analysis and meta-regression of the effect of protein supplementation on resistance training-induced gains in muscle mass and strength. Br J Sports Med. 2018.</li>' +
    '</ol><p class="small">This is a training plan, not medical advice. Let whoever is managing the hip set the limits for squats and RDLs.</p></div>';
  el.innerHTML = html;
}

/* ───────────── Data ───────────── */
function summaryText() {
  var out = ['LIFT LEDGER LOG (all weights in lb), exported ' + todayISO(), 'Next session: ' + ROT[S.meta.next % ROT.length].name + (S.meta.deloadLeft ? ' (deload, ' + S.meta.deloadLeft + ' left)' : ''), ''];
  var ss = sorted().slice(-12);
  if (!ss.length) out.push('No sessions logged yet.');
  ss.forEach(function (s) {
    out.push(s.date + '  ' + (s.name || s.sid) + (s.deload ? ' (deload)' : ''));
    s.entries.forEach(function (e) {
      out.push('  ' + (EX[e.ex] || { n: e.ex }).n + ': ' + e.sets.map(function (x) { return fmtW(x.w) + 'x' + x.r + (x.rir != null ? ' @' + x.rir + 'RIR' : ''); }).join(', '));
    });
    if (s.note) out.push('  Notes: ' + s.note);
  });
  var bw = S.meta.bw || []; if (bw.length) out.push('', 'Bodyweight: ' + bw.slice(-8).map(function (b) { return b.d + ' ' + b.w; }).join(', '));
  out.push('', 'NEXT PRESCRIPTIONS');
  ROT.forEach(function (r) {
    out.push(r.name);
    r.items.forEach(function (it) { var p = plan(it[0], it[1], false); out.push('  ' + EX[it[0]].n + ': ' + fmtW(p.w) + ' lb, ' + schemeText(it[0], it[1], false) + ' [' + p.status + ']'); });
  });
  return out.join('\n');
}
function renderData() {
  var el = $('#v-data'), st = ($('#sync').dataset.state) || 'local';
  var where = st === 'synced' || st === 'saving' ? 'Your log is saved to this page\'s cloud store and to this device. It follows you to any device where you open this page signed in.'
    : st === 'offline' || st === 'error' ? 'The cloud store could not be reached, so new entries are saved on this device and sent up the next time the page loads with a connection.'
    : 'Your log is saved in this browser on this device. Use Export below to back it up or move it.';
  el.innerHTML = '<h2 class="h-sec">Where your log lives</h2><p class="sub">' + where + '</p>' +
    '<h2 class="h-sec">Send your log to Claude</h2><p class="sub">Copies your last 12 sessions and the next prescriptions as text. Paste it into a chat when you want the program reviewed or changed.</p>' +
    '<div class="row-btns"><button type="button" class="btn primary" data-act="copy-summary">Copy training summary</button></div>' +
    '<h2 class="h-sec">Backup</h2><p class="sub">Export gives you everything as text. To restore, paste a backup into the box and tap Import.</p>' +
    '<textarea class="io" id="io" aria-label="Backup text" placeholder="Backup text appears here"></textarea>' +
    '<div class="row-btns"><button type="button" class="btn" data-act="export">Export</button><button type="button" class="btn" data-act="copy-io">Copy</button><button type="button" class="btn" data-act="import">Import</button></div>' +
    '<h2 class="h-sec">Start over</h2><p class="sub">Deletes every logged session and bodyweight entry. Your 12 Nov starting numbers stay.</p>' +
    '<div class="row-btns"><button type="button" class="btn danger" data-act="reset">Delete all logged data</button></div>';
}
function copyText(txt) {
  function fallback() { var io = $('#io'); if (io) { io.value = txt; io.focus(); io.select(); } toast('Copy blocked here. The text is selected in the box, copy it from there.'); }
  try { navigator.clipboard.writeText(txt).then(function () { toast('Copied.'); }, fallback); } catch (e) { fallback(); }
}
function dataClick(e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  var act = b.dataset.act, io = $('#io');
  if (act === 'copy-summary') { copyText(summaryText()); return; }
  if (act === 'export') { io.value = JSON.stringify({ app: 'liftledger', v: 1, meta: S.meta, sessions: S.sessions }); toast('Backup is in the box.'); return; }
  if (act === 'copy-io') { if (io.value) copyText(io.value); return; }
  if (act === 'import') {
    var d; try { d = JSON.parse(io.value); } catch (err) { toast('That is not a valid backup. Paste the full exported text.'); return; }
    if (!d || !Array.isArray(d.sessions)) { toast('That is not a valid backup. Paste the full exported text.'); return; }
    if (!confirmTap(b, 'Tap again to add ' + d.sessions.filter(validSession).length + ' sessions')) return;
    var have = {}, hadNone = !S.sessions.length; S.sessions.forEach(function (s) { have[s.id] = 1; });
    var added = 0;
    d.sessions.filter(validSession).forEach(function (s) {
      if (have[s.id]) return;
      S.meta.deleted = S.meta.deleted.filter(function (x) { return x !== s.id; });
      S.sessions.push(s); saveSession(s); added++;
    });
    if (d.meta) { (d.meta.bw || []).forEach(function (x) { if (x && x.d && x.w) addBW(x.d, x.w, true); }); if (typeof d.meta.next === 'number' && hadNone) S.meta.next = d.meta.next % ROT.length; }
    saveMeta(); curSid = null; renderAll(); toast('Imported ' + added + ' sessions.'); return;
  }
  if (act === 'reset') {
    if (!confirmTap(b, 'Tap again to delete everything')) return;
    S.sessions.slice().forEach(function (s) { deleteSession(s.id); });
    S.meta.next = 0; S.meta.deloadLeft = 0; S.meta.snooze = 0; S.meta.bw = []; saveMeta();
    drafts = {}; saveDrafts(); curSid = null; summary = null; renderAll(); toast('All logged data deleted.');
  }
}

/* ───────────── Shell ───────────── */
var TABS = ['today', 'progress', 'program', 'data'];
function showTab() {
  var t = (location.hash || '').replace('#', ''); if (TABS.indexOf(t) < 0) t = 'today';
  TABS.forEach(function (n) { $('#v-' + n).hidden = n !== t; });
  [].forEach.call(document.querySelectorAll('.nav a'), function (a) { if (a.dataset.tab === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (t === 'progress') drawCharts();
  if (t === 'data') renderData();
  window.scrollTo(0, 0);
}
function renderAll() { renderToday(); renderProgress(); renderProgram(); renderData(); }

function start() {
  loadLocal();
  renderAll(); showTab();
  var today = $('#v-today');
  today.addEventListener('input', todayInput); today.addEventListener('change', todayInput); today.addEventListener('click', todayClick);
  $('#v-progress').addEventListener('click', progressClick);
  $('#v-progress').addEventListener('change', function (e) { if (e.target.id === 'chart-ex') { chartEx = e.target.value; renderProgress(); } });
  $('#v-program').addEventListener('click', todayClick);
  $('#v-data').addEventListener('click', dataClick);
  $('#timer-add').addEventListener('click', function () { if (tInt) { tEnd += 30000; tick(); } });
  $('#timer-skip').addEventListener('click', stopTimer);
  window.addEventListener('hashchange', showTab);
  var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (!$('#v-progress').hidden) drawCharts(); }, 150); });
  try { if (navigator.wakeLock) { var lock = function () { navigator.wakeLock.request('screen').catch(function () {}); }; lock(); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') lock(); }); } } catch (e) {}
  initCloud();
}
start();
})();
</script>
</body>
</html>
